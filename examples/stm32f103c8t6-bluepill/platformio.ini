; PlatformIO Project Configuration File
; Cloud GCC verification only - the deliverable Keil project is in MDK-ARM/
; Board: STM32F103C8T6 (Blue Pill), Framework: STM32Cube (HAL, STM32CubeF1 1.8.7)
; NOTE: src_dir / include_dir are [platformio]-section options in PlatformIO 6.
; Putting them under [env:...] is silently ignored (first pio run failed at
; link time with "undefined reference to main" for exactly this reason).
[platformio]
src_dir = Core/Src
include_dir = Core/Inc

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
; The framework package already supplies system_stm32f1xx.c + the GCC
; startup file; our Core/Src/system_stm32f1xx.c is the identical file
; (same ST source, LF vs CRLF only) kept for the Keil build. Exclude it
; here so GCC does not see SystemInit / SystemCoreClock twice.
; The Keil project in MDK-ARM/ DOES compile Core/Src/system_stm32f1xx.c
; and the ARM startup file MDK-ARM/startup_stm32f103xb.s instead.
build_src_filter =
    +<*>
    -<system_stm32f1xx.c>
build_flags =
    -D USE_HAL_DRIVER
    -D STM32F103xB
    -D HSE_VALUE=8000000
